plugins {
    id 'com.android.application'
}

// Version of the vendored SameBoy core, shown in the app.
def sameboyVersion = file('../sameboy/version.mk').readLines()
        .find { it.startsWith('VERSION') }
        .split(':=')[1].trim()

android {
    namespace 'com.ominixisboss.androidboy'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.ominixisboss.androidboy'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName "1.16 (SameBoy ${sameboyVersion})"
        buildConfigField 'String', 'SAMEBOY_VERSION', "\"${sameboyVersion}\""

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    signingConfigs {
        // A fixed, public debug key committed to the repository, so every build and release is
        // signed the same way and installs as an update. Anyone can sign with it; it never goes
        // inside the APK (only its public certificate does, as with any signed app).
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Optional: set these environment variables to sign release builds with your own key instead.
        release {
            def keystore = System.getenv('ANDROIDBOY_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROIDBOY_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROIDBOY_KEY_ALIAS')
                // PKCS12 keystores (keytool's default) use the keystore password for the key too.
                keyPassword System.getenv('ANDROIDBOY_KEY_PASSWORD') ?: System.getenv('ANDROIDBOY_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('ANDROIDBOY_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    testOptions {
        // Lets Robolectric inflate the app's layouts (the save-state slot list test).
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric's native graphics (used by the skin tests) needs this on JDK 17+.
            jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED'
            // Show why a test failed in the build log, not only in the HTML report.
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }

    lint {
        // Emulators are sideloaded often; don't fail builds over Play-specific checks.
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
