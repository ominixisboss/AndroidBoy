name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    name: Core smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the host test
        run: tests/run_host_test.sh

  shaders:
    name: Filter shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Compile and render every filter
        run: node tests/shader_test.js app/src/main/assets/shaders shader-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shader-previews
          path: shader-previews/

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs and run the unit tests
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug testDebugUnitTest

      - name: Check APK contents
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "== $apk ($(stat -c %s "$apk") bytes)"
            unzip -l "$apk" | grep -E 'lib/.*\.so|assets/' | tee contents.txt
            for abi in arm64-v8a armeabi-v7a x86 x86_64; do
              grep -q "lib/$abi/libandroidboy.so" contents.txt || { echo "missing $abi library"; exit 1; }
            done
            for rom in dmg mgb sgb sgb2 cgb cgb0 agb; do
              grep -q "assets/BootROMs/${rom}_boot.bin" contents.txt || { echo "missing $rom boot ROM"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidBoy-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidBoy-release
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-previews
          path: app/build/skin-previews/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
