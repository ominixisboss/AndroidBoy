name: Release

# When main has an app version (versionName in app/build.gradle) with no release yet,
# builds the release APK and publishes it as a GitHub release tagged v<version>.
# Bump versionName to publish a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/.*versionName "\([^ "]*\).*/\1/p' app/build.gradle)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released; bump versionName to publish a new release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Set up the signing key
        if: steps.version.outputs.exists == 'false'
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDBOY_KEYSTORE_BASE64 }}
        run: |
          # Without a release key in the secrets, releases use the repository's shared debug key
          # (app/debug.keystore). See "Signing releases" in the README.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing with the shared debug key."
            echo "kind=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROIDBOY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "kind=release" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        if: steps.version.outputs.exists == 'false'
        env:
          ANDROIDBOY_KEYSTORE_PASSWORD: ${{ secrets.ANDROIDBOY_KEYSTORE_PASSWORD }}
          ANDROIDBOY_KEY_ALIAS: ${{ secrets.ANDROIDBOY_KEY_ALIAS }}
          ANDROIDBOY_KEY_PASSWORD: ${{ secrets.ANDROIDBOY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the APK's signature
        if: steps.version.outputs.exists == 'false'
        id: signature
        env:
          KEY_KIND: ${{ steps.key.outputs.kind }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          # The APK must be signed with the key this run chose, never a runner's random debug key.
          if [ "$KEY_KIND" = release ] && grep -q "CN=Android Debug" certs.txt; then
            echo "::error::A release key is configured, but the APK is signed with a debug key."
            exit 1
          fi
          if [ "$KEY_KIND" = debug ]; then
            expected="$(keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey \
              | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
            grep -q "SHA-256 digest: $expected" certs.txt || {
              echo "::error::The APK isn't signed with the shared debug key (app/debug.keystore)."
              exit 1
            }
          fi
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt)"
          [ -n "$digest" ] || { echo "::error::Could not read the signing certificate."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check APK contents
        if: steps.version.outputs.exists == 'false'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" > contents.txt
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -q "lib/$abi/libandroidboy.so" contents.txt || { echo "missing $abi library"; exit 1; }
          done
          for rom in dmg mgb sgb sgb2 cgb cgb0 agb; do
            grep -q "assets/BootROMs/${rom}_boot.bin" contents.txt || { echo "missing $rom boot ROM"; exit 1; }
          done

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CERT_DIGEST: ${{ steps.signature.outputs.digest }}
          KEY_KIND: ${{ steps.key.outputs.kind }}
        run: |
          apk="AndroidBoy-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          sameboy="$(sed -n 's/^VERSION *:= *//p' sameboy/version.mk)"
          upgrade="**If you have v1.0 installed**, it was signed with a one-off key: export your save files from the game list (long-press a game), uninstall v1.0, then install this version and import them again."
          if [ "$KEY_KIND" = release ]; then
            SIGNING="**Signing:** signed with the AndroidBoy release key (certificate SHA-256 \`${CERT_DIGEST}\`). Future releases use the same key, so they install as updates. $upgrade"
          else
            SIGNING="**Signing:** signed with AndroidBoy's shared debug key, which is public in the repository (certificate SHA-256 \`${CERT_DIGEST}\`). Builds signed with it install as updates of each other. $upgrade"
          fi
          cat > notes.md <<NOTES
          AndroidBoy ${TAG}: a standalone Game Boy and Game Boy Color emulator for Android 8.0 and later, built on SameBoy ${sameboy}.

          **Install:** download \`${apk}\`, open it on your phone and allow installing from this source. Then add your \`.gb\`/\`.gbc\` ROMs (or \`.zip\` files containing them) from the game list.

          The APK runs on arm64, 32-bit ARM, x86 and x86_64 devices. No BIOS files are needed.

          ${SIGNING}

          See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md) for controls and features.
          NOTES
          gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" \
            --title "AndroidBoy ${TAG}" --notes-file notes.md
